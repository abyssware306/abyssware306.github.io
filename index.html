<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbyssWare — Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d0d1a; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }

        nav {
            background: #111127; padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1e1e3a;
        }
        nav .logo { font-size: 1.4rem; font-weight: 700; color: #fff; }
        nav .logo span { color: #7c3aed; }
        nav a { color: #aaa; text-decoration: none; font-size: 0.9rem; }
        nav a:hover { color: #fff; }

        .container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 2rem;
        }

        .payment-card {
            background: #151530; border: 1px solid #1e1e3a;
            border-radius: 16px; padding: 2.5rem; max-width: 480px; width: 100%;
            text-align: center;
        }

        .payment-card h1 { font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem; }
        .payment-card .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }

        .amount {
            font-size: 2.5rem; font-weight: 700; color: #fff;
            margin-bottom: 0.3rem;
        }
        .amount-btc { color: #f7931a; font-size: 1rem; margin-bottom: 2rem; }

        .qr-wrapper {
            background: #fff; border-radius: 12px; padding: 1rem;
            display: inline-block; margin-bottom: 1.5rem;
        }
        .qr-wrapper img { display: block; width: 200px; height: 200px; }

        .address-box {
            background: #0d0d1a; border: 1px solid #1e1e3a;
            border-radius: 8px; padding: 0.8rem 1rem;
            font-family: 'Courier New', monospace; font-size: 0.8rem;
            word-break: break-all; color: #ccc; margin-bottom: 1rem;
            position: relative;
        }
        .copy-btn {
            position: absolute; top: 0.5rem; right: 0.5rem;
            background: #7c3aed; color: #fff; border: none;
            padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer;
            font-size: 0.75rem; transition: 0.2s;
        }
        .copy-btn:hover { background: #6d28d9; }
        .copy-btn.copied { background: #22c55e; }

        .steps {
            text-align: left; margin-top: 1.5rem; padding-top: 1.5rem;
            border-top: 1px solid #1e1e3a;
        }
        .steps h3 { color: #fff; font-size: 0.95rem; margin-bottom: 0.8rem; }
        .steps ol { padding-left: 1.2rem; }
        .steps li { color: #999; font-size: 0.85rem; margin-bottom: 0.4rem; }

        .note {
            margin-top: 1.5rem; padding: 0.8rem; background: #1a1a35;
            border-radius: 8px; font-size: 0.8rem; color: #888;
            border-left: 3px solid #f7931a;
        }

        footer {
            text-align: center; padding: 1.5rem; color: #555;
            font-size: 0.8rem; border-top: 1px solid #1e1e3a;
        }
        footer a { color: #777; text-decoration: none; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Abyss<span>Ware</span></div>
    <a href="https://abyssware.edgeone.dev/">← Back to Site</a>
